<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Areas | JOEL INVESTMENT</title>
    <meta name="description" content="Explore our comprehensive business areas and industry solutions.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        /* ============================================
           BUSINESS AREAS SHOWCASE SECTION
           ============================================ */

        .business-areas-section {
            position: relative;
            padding: 100px 0;
            background: linear-gradient(135deg, #0f1828 0%, #1a2847 100%);
            overflow: hidden;
        }

        /* Background image with overlay and particles container */
        .business-areas-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></pattern></defs><rect width="1200" height="800" fill="url(%23grid)"/></svg>');
            opacity: 0.5;
            pointer-events: none;
        }

        /* Dark navy overlay */
        .business-areas-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(15, 24, 40, 0.4) 0%, rgba(26, 40, 71, 0.8) 100%);
            pointer-events: none;
        }

        .business-areas-container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Section Header */
        .business-areas-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .business-areas-header span {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .business-areas-header h2 {
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .business-areas-header p {
            font-size: 18px;
            color: #b0bbd0;
            font-weight: 300;
            max-width: 700px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        /* Subtle divider */
        .business-areas-divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            margin: 0 auto;
        }

        /* Showcase Container */
        .business-areas-showcase {
            position: relative;
            height: 550px;
            margin-top: 60px;
        }

        /* Slider Track */
        .business-areas-slider {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* Cards Wrapper */
        .business-areas-track {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        /* Individual Business Card */
        .business-card {
            position: absolute;
            width: 320px;
            height: 450px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        /* Card Image */
        .business-card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1a2847 0%, #0f1828 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #d4af37;
            overflow: hidden;
            position: relative;
        }

        .business-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Card Content */
        .business-card-content {
            padding: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .business-card-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f1828;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .business-card-description {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .business-card-link {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: #d4af37;
            text-decoration: none;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .business-card-link:hover {
            gap: 12px;
        }

        .business-card-link::after {
            content: '→';
            display: inline-block;
        }

        /* Card States */
        .business-card.side-card {
            opacity: 0.5;
            transform: scale(0.92) translateY(20px);
        }

        .business-card.featured-card {
            transform: scale(1.08);
            box-shadow: 0 30px 60px rgba(212, 175, 55, 0.15),
                        0 0 0 3px #d4af37;
            z-index: 10;
            opacity: 1;
        }

        .business-card.featured-card .business-card-image {
            height: 220px;
        }

        /* Hover Effect */
        .business-card:hover:not(.side-card) {
            transform: scale(1.03);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
        }

        .business-card.featured-card:hover {
            transform: scale(1.11);
            box-shadow: 0 40px 100px rgba(212, 175, 55, 0.25),
                        0 0 0 3px #d4af37;
        }

        /* Navigation Arrows */
        .business-areas-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: #0f1828;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #b0bbd0;
            transition: all 0.3s ease;
            z-index: 20;
        }

        .business-areas-arrow:hover {
            background: #1a2847;
            border-color: #d4af37;
            color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .business-areas-arrow.left {
            left: 10px;
        }

        .business-areas-arrow.right {
            right: 10px;
        }

        /* Animated Gold Particles */
        .particle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #d4af37;
            border-radius: 50%;
            opacity: 0;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0% {
                opacity: 0;
                transform: translateY(100vh) translateX(0);
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) translateX(100px);
            }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .business-areas-header h2 {
                font-size: 36px;
            }

            .business-card {
                width: 280px;
                height: 400px;
            }

            .business-card-content {
                padding: 24px;
            }

            .business-areas-showcase {
                height: 480px;
            }

            /* 2 Cards visible on tablet */
            .business-card.left-card {
                left: 60px;
            }

            .business-card.featured-card {
                left: 50%;
                transform: translateX(-50%) scale(1.05);
            }

            .business-card.right-card {
                right: 60px;
            }
        }

        @media (max-width: 768px) {
            .business-areas-section {
                padding: 80px 0;
            }

            .business-areas-header h2 {
                font-size: 28px;
            }

            .business-areas-header p {
                font-size: 16px;
            }

            .business-card {
                width: 260px;
                height: 380px;
            }

            .business-areas-showcase {
                height: 420px;
            }

            .business-areas-arrow {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .business-areas-arrow.left {
                left: 5px;
            }

            .business-areas-arrow.right {
                right: 5px;
            }

            /* 1 Card visible on mobile */
            .business-card.left-card {
                left: -400px;
            }

            .business-card.featured-card {
                left: 50%;
                transform: translateX(-50%);
            }

            .business-card.right-card {
                right: -400px;
            }
        }

        @media (max-width: 480px) {
            .business-areas-section {
                padding: 60px 0;
            }

            .business-areas-header h2 {
                font-size: 24px;
            }

            .business-areas-header p {
                font-size: 14px;
            }

            .business-card {
                width: 100%;
                max-width: 280px;
                height: 360px;
            }

            .business-areas-showcase {
                height: 400px;
            }

            .business-areas-container {
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>

<!-- BUSINESS AREAS SHOWCASE SECTION -->
<section class="business-areas-section">
    <!-- Particle Container -->
    <div class="particle-container" id="particleContainer"></div>

    <div class="business-areas-container">
        <!-- Section Header -->
        <div class="business-areas-header">
            <span>Our Expertise</span>
            <h2>Our Business Areas</h2>
            <p>Comprehensive solutions designed to drive growth and create value across key industries</p>
            <div class="business-areas-divider"></div>
        </div>

        <!-- Showcase Area -->
        <div class="business-areas-showcase">
            <!-- Left Arrow -->
            <button class="business-areas-arrow left" id="prevBtn" aria-label="Previous business area">
                ←
            </button>

            <!-- Slider Track -->
            <div class="business-areas-slider">
                <div class="business-areas-track" id="sliderTrack">
                    <!-- Cards will be dynamically generated by JavaScript -->
                </div>
            </div>

            <!-- Right Arrow -->
            <button class="business-areas-arrow right" id="nextBtn" aria-label="Next business area">
                →
            </button>
        </div>
    </div>
</section>

<script>
    // Business Areas Data
    const businessAreas = [
        {
            id: 1,
            title: 'Mining & Natural Resources',
            description: 'Strategic guidance in mineral exploration, resource development, and sustainable extraction practices.',
            icon: '⛏️'
        },
        {
            id: 2,
            title: 'Agriculture',
            description: 'Supporting agribusiness growth, market access, and agricultural value chain development.',
            icon: '🌾'
        },
        {
            id: 3,
            title: 'Manufacturing',
            description: 'Enhancing production efficiency, supply chain optimization, and industrial growth strategies.',
            icon: '🏭'
        },
        {
            id: 4,
            title: 'International Trade',
            description: 'Facilitating cross-border commerce, trade agreements, and global market expansion.',
            icon: '🌍'
        },
        {
            id: 5,
            title: 'Financial Services',
            description: 'Comprehensive financial advisory, investment structuring, and capital market solutions.',
            icon: '💰'
        },
        {
            id: 6,
            title: 'Infrastructure Projects',
            description: 'Large-scale project development, financing support, and infrastructure investment advisory.',
            icon: '🏗️'
        }
    ];

    // Slider Configuration
    let currentIndex = 0;
    const totalCards = businessAreas.length;
    let autoPlayInterval = null;

    // Initialize Slider
    function initSlider() {
        renderCards();
        updateCardPositions();
        generateParticles();
        startAutoPlay();

        // Event Listeners
        document.getElementById('prevBtn').addEventListener('click', previousCard);
        document.getElementById('nextBtn').addEventListener('click', nextCard);
        
        // Pause auto-play on hover
        document.querySelector('.business-areas-showcase').addEventListener('mouseenter', stopAutoPlay);
        document.querySelector('.business-areas-showcase').addEventListener('mouseleave', startAutoPlay);
    }

    // Render Cards
    function renderCards() {
        const track = document.getElementById('sliderTrack');
        track.innerHTML = '';

        for (let i = 0; i < totalCards; i++) {
            const card = document.createElement('div');
            card.className = 'business-card';
            card.dataset.index = i;

            const areaData = businessAreas[i];
            card.innerHTML = `
                <div class="business-card-image">
                    ${areaData.icon}
                </div>
                <div class="business-card-content">
                    <div>
                        <h3 class="business-card-title">${areaData.title}</h3>
                        <p class="business-card-description">${areaData.description}</p>
                    </div>
                    <a href="#" class="business-card-link">Learn More</a>
                </div>
            `;

            card.addEventListener('click', (e) => {
                e.preventDefault();
                setActiveCard(i);
            });

            track.appendChild(card);
        }
    }

    // Update Card Positions
    function updateCardPositions() {
        const cards = document.querySelectorAll('.business-card');
        const screenWidth = window.innerWidth;

        cards.forEach((card, index) => {
            card.classList.remove('featured-card', 'side-card', 'left-card', 'right-card');

            let position;
            const totalCards = cards.length;
            const relativeIndex = (index - currentIndex + totalCards) % totalCards;

            if (relativeIndex === 0) {
                // Featured card (center)
                card.classList.add('featured-card');
                position = '50%';
                card.style.left = position;
                card.style.transform = 'translateX(-50%) scale(1.08)';
                card.style.zIndex = 10;
            } else if (relativeIndex === totalCards - 1) {
                // Left card
                card.classList.add('side-card', 'left-card');
                card.style.left = '0';
                card.style.transform = 'scale(0.92) translateY(20px)';
                card.style.zIndex = 5;
            } else if (relativeIndex === 1) {
                // Right card
                card.classList.add('side-card', 'right-card');
                card.style.right = '0';
                card.style.transform = 'scale(0.92) translateY(20px)';
                card.style.zIndex = 5;
            } else {
                // Hidden cards
                card.style.left = '50%';
                card.style.transform = 'translateX(-50%) scale(0.8)';
                card.style.zIndex = 1;
                card.style.opacity = '0';
            }
        });
    }

    // Next Card
    function nextCard() {
        currentIndex = (currentIndex + 1) % totalCards;
        updateCardPositions();
        resetAutoPlay();
    }

    // Previous Card
    function previousCard() {
        currentIndex = (currentIndex - 1 + totalCards) % totalCards;
        updateCardPositions();
        resetAutoPlay();
    }

    // Set Active Card
    function setActiveCard(index) {
        currentIndex = index;
        updateCardPositions();
        resetAutoPlay();
    }

    // Auto-play
    function startAutoPlay() {
        if (autoPlayInterval) return;
        autoPlayInterval = setInterval(() => {
            nextCard();
        }, 3000);
    }

    function stopAutoPlay() {
        if (autoPlayInterval) {
            clearInterval(autoPlayInterval);
            autoPlayInterval = null;
        }
    }

    function resetAutoPlay() {
        stopAutoPlay();
        startAutoPlay();
    }

    // Generate Animated Particles
    function generateParticles() {
        const container = document.getElementById('particleContainer');
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const xPos = Math.random() * 100;
            const duration = 6 + Math.random() * 4;
            const delay = Math.random() * 2;
            
            particle.style.left = xPos + '%';
            particle.style.bottom = '-10px';
            particle.style.animation = `float ${duration}s infinite ease-in-out`;
            particle.style.animationDelay = delay + 's';
            
            container.appendChild(particle);
        }
    }

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') previousCard();
        if (e.key === 'ArrowRight') nextCard();
    });

    // Handle Window Resize
    window.addEventListener('resize', updateCardPositions);

    // Initialize on Page Load
    document.addEventListener('DOMContentLoaded', initSlider);
</script>

</body>
</html>
